[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-contact-rgb"
version = "1.0.0"
description = "仅使用 RGB 的网球击球与落地事件检测"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "pytorchvideo==0.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
tennis-contact = "tennis_contact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

